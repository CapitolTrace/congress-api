name: Publish to npm

# Publishes when a GitHub release is created, authenticated via npm Trusted
# Publishing (OIDC) — there is no NPM_TOKEN secret anymore. npm revoked
# classic automation tokens and no longer offers a 2FA-exempt token path, so
# the trusted publisher configured on npmjs.com (package Settings → Trusted
# Publisher → GitHub Actions: CapitolTrace/congress-api, publish.yml) is the
# only credential this workflow needs; the job mints a short-lived OIDC token
# per run.
#
# Provenance attestation is generated automatically on OIDC publishes from a
# public repo — no --provenance flag needed.
#
# Semver-tag gate retained: marker tags like v1 can never publish.
on:
  release:
    types: [published]

jobs:
  publish:
    # Only full semver tags (v1.2.0) publish; skip marker tags like v1.
    if: contains(github.event.release.tag_name, '.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — used for both auth (trusted publishing) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs typecheck + test + build
      - run: npm publish
